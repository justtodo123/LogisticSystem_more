# 本地一键启动：docker compose up -d
# 真实密钥（DEEPSEEK_API_KEY 等）请通过 docker-compose.override.yml 注入（已被 gitignore）
services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: logistics-backend:latest
    container_name: logistics-migrate
    command: ["python", "scripts/release_migrate.py"]
    environment:
      ENV: dev
      DATABASE_URL: sqlite:////app/data/logistics.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
    volumes:
      - logistics-data:/app/data
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: logistics-backend:latest
    container_name: logistics-backend
    environment:
      ENV: dev
      DATABASE_URL: sqlite:////app/data/logistics.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      CORS_ORIGINS: http://localhost:8080
      # T4-3 Redis 缓存（容器网络内服务名 redis）
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - logistics-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    command: redis-server --appendonly yes
    volumes:
      - logistics-redis:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: logistics-frontend:latest
    container_name: logistics-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  logistics-data:
  logistics-redis:
