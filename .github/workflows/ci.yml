# CI 工作流：Push 到 main 或 PR 时自动跑后端测试 + 前端类型检查/构建
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-check:
    name: 数据库迁移基线
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: sqlite:////tmp/logistics-migration-ci.db
      JWT_SECRET: ci-only-r2-00a-migration-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 校验唯一 Alembic head
        run: test "$(python -m alembic -c alembic.ini heads | wc -l)" -eq 1

      - name: 校验发布迁移门禁与 metadata parity
        run: |
          python scripts/release_migrate.py
          python -m alembic -c alembic.ini check

      - name: 运行迁移与索引专项测试
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/migration
          tests/unit/core/test_model_registry.py
          tests/unit/core/test_database_sqlite.py
          tests/unit/services/test_db_indexes.py
          tests/unit/scripts/test_release_migrate.py

  backend-test:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行后端测试
        run: python -m pytest -q -p no:cacheprovider

  p1-postgres-redis:
    name: P1 PostgreSQL + Redis 协议与多 worker 验证
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          POSTGRES_DB: logistics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics -d logistics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://logistics:logistics@localhost:5432/logistics
      P1_DATABASE_URL: postgresql+psycopg://logistics:logistics@localhost:5432/logistics
      REDIS_ENABLED: "true"
      REDIS_URL: redis://localhost:6379/0
      P1_REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-r2-05-p1-secret-value-32chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PostgreSQL 发布迁移门禁
        run: python scripts/release_migrate.py

      - name: P1 PostgreSQL/Redis 协议复跑
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/p1/test_postgres_baseline.py
          tests/p1/test_redis_baseline.py
          tests/p1/test_postgres_protocols.py
          tests/unit/core/test_database_url.py

      - name: 初始化多 worker 合成数据
        run: |
          python scripts/init_users.py
          python scripts/init_demo_data.py

      - name: 启动可单独寻址的应用与 outbox worker
        shell: bash
        run: |
          mkdir -p p1-artifacts
          python -m uvicorn main:app --host 127.0.0.1 --port 18001 \
            >p1-artifacts/worker-a.log 2>&1 &
          echo $! > p1-artifacts/worker-a.pid
          python -m uvicorn main:app --host 127.0.0.1 --port 18002 \
            >p1-artifacts/worker-b.log 2>&1 &
          echo $! > p1-artifacts/worker-b.pid
          python scripts/outbox_worker.py --worker-id gha-p1-outbox \
            >p1-artifacts/outbox-worker.log 2>&1 &
          echo $! > p1-artifacts/outbox-worker.pid

          cleanup() {
            for pid_file in p1-artifacts/*.pid; do
              if [ -f "$pid_file" ]; then
                kill "$(tr -d '[:space:]' < "$pid_file")" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          export PYTHONUNBUFFERED=1
          if ! python scripts/wait_http.py --timeout 60 \
            http://127.0.0.1:18001/api/health \
            http://127.0.0.1:18002/api/health; then
            for log_file in p1-artifacts/*.log; do
              echo "===== ${log_file} ====="
              cat "${log_file}" || true
            done
            exit 1
          fi

          python scripts/smoke_local.py --base-url http://127.0.0.1:18001
          P1_WORKER_A_URL=http://127.0.0.1:18001 \
          P1_WORKER_B_URL=http://127.0.0.1:18002 \
            python -m pytest -q -p no:cacheprovider \
            tests/p1/test_multi_worker_http.py

          cat > p1-artifacts/scenario-summary.txt <<'EOF'
          topology=two separately addressed single-worker Uvicorn processes
          worker_a=http://127.0.0.1:18001
          worker_b=http://127.0.0.1:18002
          database=PostgreSQL 16 service
          cache=Redis 7 service
          outbox_worker=separate process
          assertions=HTTP smoke, cross-process JWT revocation, durable idempotent replay
          data=synthetic
          EOF

      - name: 上传 P1 脱敏日志与场景摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-postgres-redis-worker-logs
          path: |
            src/backend/p1-artifacts/*.log
            src/backend/p1-artifacts/scenario-summary.txt
          if-no-files-found: warn
          retention-days: 7

  frontend-check:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build
