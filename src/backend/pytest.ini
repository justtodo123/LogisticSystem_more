[pytest]
# pytest 配置文件
# 运行方式：cd src/backend && python -m pytest tests/ -v

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: 单元测试
    integration: 集成测试
    api: API 测试
    slow: 慢速测试
    phase1: 阶段1测试
    phase2: 阶段2测试
    phase3: 阶段3测试
    phase4: 阶段4测试
    phase5: 阶段5测试
    phase6: 阶段6测试
    phase7: 阶段7测试
    phase8: 阶段8测试
    phase9: 阶段9测试

# 异步测试支持
asyncio_mode = auto
